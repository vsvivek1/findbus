name: Play foreground service video

# Push to claude/play-screenshots with [video] in the commit message: builds the
# test APK, records the driver Start → notification → Stop flow on an
# emulator, and commits media/foreground-service-demo.mp4.
on:
  push:
    branches: [claude/play-screenshots]

permissions:
  contents: write

jobs:
  video:
    if: contains(github.event.head_commit.message, '[video]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The app shell loads this branch's site from the runner, so the video
      # shows the code on this branch (the emulator reaches the host at 10.0.2.2).
      - name: Build and serve this branch's site
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://vspbbwpehvenmxddgbhm.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzcGJid3BlaHZlbm14ZGRnYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNzY0MTAsImV4cCI6MjEwNTc1MjQxMH0.dH6rg_EMpXUl4zZ2o9Ngq-ImrcfKZmBxOugbntBkCBA
        run: |
          npm ci
          npm run build
          nohup setsid npx next start -p 3000 > "$RUNNER_TEMP/next.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/find >/dev/null && break; sleep 1; done
          curl -sf -o /dev/null -w "site %{http_code}\n" http://localhost:3000/find

      - name: Build test APK
        run: |
          sed -i 's#url: "https://findbus-azure.vercel.app/find",#url: "http://10.0.2.2:3000/find", cleartext: true,#' capacitor.config.ts
          grep -n "url:" capacitor.config.ts
          npx cap sync android
          cd android && ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash scripts/play-fgs-video.sh android/app/build/outputs/apk/debug/app-debug.apk "http://10.0.2.2:3000/driver?key=ba97bbc1-a786-42e2-bff1-7cb969326862" "$PWD/foreground-service-demo.mp4"

      - uses: actions/upload-artifact@v4
        with:
          name: foreground-service-demo
          path: foreground-service-demo.mp4

      - name: Commit video
        run: |
          git checkout -- capacitor.config.ts
          mkdir -p media && mv foreground-service-demo.mp4 fgs-diag.txt media/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add media
          git commit -m "Add foreground service demo video"
          git pull --rebase --autostash origin claude/play-screenshots
          git push
