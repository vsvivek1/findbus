name: Play foreground service video

# Push to claude/play-screenshots with [video] in the commit message: builds the
# test APK, records the driver Start → notification → Stop flow on an
# emulator, and commits media/foreground-service-demo.mp4.
on:
  push:
    branches: [claude/play-screenshots]

permissions:
  contents: write

jobs:
  video:
    if: contains(github.event.head_commit.message, '[video]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build test APK
        run: |
          npm ci
          npx cap sync android
          cd android && ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash scripts/play-fgs-video.sh android/app/build/outputs/apk/debug/app-debug.apk "https://findbus-azure.vercel.app/driver?key=ba97bbc1-a786-42e2-bff1-7cb969326862" "$PWD/foreground-service-demo.mp4"

      - uses: actions/upload-artifact@v4
        with:
          name: foreground-service-demo
          path: foreground-service-demo.mp4

      - name: Commit video
        run: |
          mkdir -p media && mv foreground-service-demo.mp4 media/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add media
          git commit -m "Add foreground service demo video"
          git pull --rebase --autostash origin claude/play-screenshots
          git push
